name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Projektordner suchen
        run: |
          echo "Gefundene Projekte:"
          grep -rH "rootProject.name" --include=settings.gradle.kts . || true
          SETTINGS=$(grep -rl "F3B-E" --include=settings.gradle.kts . 2>/dev/null | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Neues Projekt (F3B-E) nicht gefunden. Bitte den Inhalt von F3B-E-Wettbewerbstimer.zip hochladen."
            exit 1
          fi
          echo "PROJEKT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Baue: $(dirname "$SETTINGS")"
          grep "app_name" "$(dirname "$SETTINGS")/app/src/main/res/values/strings.xml"

      - name: APK erstellen
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJEKT }}

      - name: APK umbenennen
        run: cp "${{ env.PROJEKT }}/app/build/outputs/apk/debug/app-debug.apk" "F3B-E-Wettbewerbstimer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: F3B-E-Wettbewerbstimer-APK
          path: F3B-E-Wettbewerbstimer.apk
